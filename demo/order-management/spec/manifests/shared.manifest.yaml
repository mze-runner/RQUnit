# Cross-service facts (§5.5). A fact enters here on demonstrated reuse — two
# service manifests needing it — never speculatively.
service: shared
version: "1.0"

conventions:
  field_names: snake_case
  path_segments: kebab-case

vocabularies:
  access_tiers: [public, internal, protected]
  cancellation_reasons: [customer, fraud, out_of_stock]

values:
  retention: { audit_days: 90 }
  fulfilment: { halt_seconds: 5 }

# Structures minted somewhere, carried as a VALUE inside a payload, and
# validated elsewhere. A census stops at an encoding boundary: the token is a
# `string` on the wire and its claims live inside that string.
artifacts:
  access-token:
    access_tier: protected
    fields:
      - { name: sub, where: claims, presence: always, type: string }
      - { name: kid, where: header, presence: always, type: string }
      - { name: iss, presence: never, note: two environments once trusted each other's tokens }

# Never in ANY audit record, store-wide. Not an event-by-event judgment.
audit_forbidden: [password, card_number, refund_amount_override]
