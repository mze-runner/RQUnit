# RQUnit consumer configuration. Only repo-specific inputs belong here — the
# store layout itself is fixed (spec/ at this root) and is never configured.
#
# Core interprets only the `adapter` role declarations and `literal_scan`;
# every other key under a stack is the adapter's own configuration, passed
# through untouched.

[stacks.rust]

# tests/ directories swept by the hardcoded-bound advisory (core-read).
literal_scan = ["**/tests"]

# ---- adapter-owned configuration ---------------------------------------------
# Core passes everything below through untouched; the Rust adapter reads it.

# Cargo.toml of every crate whose tests/ the scanner walks.
trace_scan = ["**/Cargo.toml"]
# Crate receiving generated constants and statechart conformance suites.
conformance_crate = "spec-conformance-tests"
# Manifest service slug the extractor reports on. It does not guess this.
service = "service-orders"

# ---- adapter roles -----------------------------------------------------------
# Each role is either a command core execs (cmd = ["..."]) or an artifact an
# earlier pipeline step produced (artifact = "path").

[stacks.rust.adapter]
# Where this stack's extractor writes actual-surface.json — the artifact
# `rqunit conformance` reconciles against the manifests.
extractor = { artifact = "actual-surface.json" }
# Artifact-mode emitter: the committed emit-response.json is this store's
# rendered suite-set, regenerated whenever models or manifest values change.
emitter = { artifact = "emit-response.json" }
