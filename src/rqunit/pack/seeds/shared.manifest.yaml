# Cross-service facts (§5.5). Seeded because the `access_tiers` vocabulary
# must exist before any endpoint validates (C5) — the tier set is project
# data, deliberately not a schema enum. Tune it to the consumer's access
# model at adoption.
service: shared
version: "1.0"
vocabularies:
  access_tiers: [public, internal, protected]

# Structures minted somewhere, carried as a VALUE inside payloads, and validated
# elsewhere — credentials above all. It is a table rather than a separate
# artifact kind because a manifest already IS a contract, and two words
# for one idea cost every consumer an explanation. A census stops at an encoding
# boundary: a response says `access_token: string`, and the claims are inside
# that string. Promotion by demonstrated reuse applies (§5.5).
#
# artifacts:
#   jwt-access-token:
#     access_tier: protected
#     fields:
#       - { name: sub, where: claims, presence: always, type: string }
#       - { name: iss, presence: never }
