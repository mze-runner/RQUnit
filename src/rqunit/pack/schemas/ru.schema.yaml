# Requirement Unit schema (JSON Schema draft 2020-12, expressed in YAML)
# Normative source: ru-framework-spec.md §3, §6, §7.
# Enforced by: the schema stage for shape, plus the semantic lints.
# NOTE: schema validates SHAPE only. Statement parseability (L1), reference
# resolution (L15), actor membership (L12) etc. are semantic lints, not schema.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "spec/framework/ru.schema.yaml"
title: RequirementUnit
type: object
additionalProperties: false        # forbidden fields (priority, estimate,
                                   # assignee, role, permission) rejected here (L8)
required: [id, statement, syntax, status, source_ref, verification, tags]

properties:

  id:
    type: string
    description: >
      Draft stage: RU-draft-<ULID>. Active/superseded/retired:
      RU-<SEQUENCE> or RU-<SEGMENT>-<SEQUENCE> (formats §1).
      Cross-stage constraint enforced in allOf below.
    pattern: "^(RU-draft-[0-9A-HJKMNP-TV-Z]{26}|RU-(?:((?![0-9A-HJKMNP-TV-Z]{4}-)[A-Z][A-Z0-9]{1,7})-)?([0-9A-HJKMNP-TV-Z]{4}))$"

  draft_id:
    type: string
    description: The pre-activation ULID, recorded by spec-activate at Gate 1.
    pattern: "^RU-draft-[0-9A-HJKMNP-TV-Z]{26}$"

  segment:
    type: string
    description: >
      Which id space to allocate into at Gate 1 (formats §1). DRAFTS ONLY —
      once activated the id carries the segment, and a second copy of the same
      fact is a drift class. Declared by the reviewer, never derived from
      scope.owns: segments and services are many-to-many.
    pattern: "^(?![0-9A-HJKMNP-TV-Z]{4}$)[A-Z][A-Z0-9]{1,7}$"

  statement:
    type: string
    minLength: 20
    description: >
      Exactly one normative EARS/Gherkin statement. May embed manifest
      references {value:x} {endpoint:x} {problem:x} {audit:x} {message:x}
      {channel:x} {frame:c.f} {vocab:x}. Parse + bound + compound rules are
      lints L1, L2 and L3, not schema.

  syntax:
    enum: [ears, gherkin]

  status:
    enum: [draft, active, superseded, retired]

  tier:
    enum: [standard, constitutional]
    default: standard

  feature:
    type: string
    pattern: "^FEAT-[a-z0-9-]+$"

  source_ref:
    type: string
    description: "INT anchor: <INT id>#L<start>[-<end>]. Lines only — see spec §4."
    pattern: "^INT-(?:[0-9A-HJKMNP-TV-Z]{26}|[0-9]{4})#L[0-9]+(-[0-9]+)?$"

  supersedes:
    type: string
    pattern: "^RU-(?:((?![0-9A-HJKMNP-TV-Z]{4}-)[A-Z][A-Z0-9]{1,7})-)?([0-9A-HJKMNP-TV-Z]{4})$"

  rationale_ref:
    type: string
    pattern: "^ADR-[A-Za-z0-9-]+$"

  verification:
    type: array
    minItems: 1
    items:
      oneOf:

        - type: object              # ---- test ----
          additionalProperties: false
          required: [type, ref]
          properties:
            type: { const: test }
            ref:
              type: string
              description: "Stable test identifier resolvable by spec-trace, or TODO(...)."
              pattern: "^(TODO\\(.+\\)|[A-Za-z_][A-Za-z0-9_:.\\-/]+)$"

        - type: object              # ---- model ----
          additionalProperties: false
          required: [type, ref, model_hash, conformance]
          properties:
            type: { const: model }
            ref: { type: string, pattern: "^MDL-[a-z0-9-]+$" }
            model_hash:
              type: string
              description: sha256 of the model file at conformance-generation time (§6.3).
              pattern: "^sha256:[0-9a-f]{64}$"
            conformance:
              enum: [generated, manual]
            justification:
              type: string
              description: REQUIRED when conformance=manual (enforced in allOf).

        - type: object              # ---- human ----
          additionalProperties: false
          required: [type, criterion]
          properties:
            type: { const: human }
            criterion:
              type: string
              minLength: 10
              description: What the Gate 2 reviewer judges, stated as a question.

  scope:
    type: object
    additionalProperties: false
    required: [owns]
    properties:
      owns:
        type: array
        minItems: 1
        items: { type: string, pattern: "^[^{}]+$" }   # no manifest refs in scope (§3.1)
      must_not_touch:
        type: array
        items: { type: string, pattern: "^[^{}]+$" }

  tags:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, pattern: "^[a-z][a-z0-9-]*$" }   # membership in tags.yaml is L10

  # ---- tool-written fields (spec-activate owns; hand-authoring detected by
  # ---- L19 hash mismatch, not by schema) ----
  gate1_stamp:
    type: object
    additionalProperties: false
    required: [hash, by, at]
    properties:
      hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
      by:
        type: string
        minLength: 1
        pattern: "^[^@]+$"   # stable operator HANDLE, never contact info (no
                             # emails — the store is published; formats §9)
      at:   { type: string, format: date-time }

  link_fingerprints:
    type: object
    description: Cross-artifact reference fingerprints at activation (§7.3).
    propertyNames: { pattern: "^(RU-(?:((?![0-9A-HJKMNP-TV-Z]{4}-)[A-Z][A-Z0-9]{1,7})-)?([0-9A-HJKMNP-TV-Z]{4})|ADR-[A-Za-z0-9-]+)$" }
    additionalProperties: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

allOf:
  # Permanent id format required once out of draft.
  - if:
      properties: { status: { enum: [active, superseded, retired] } }
    then:
      properties: { id: { pattern: "^RU-(?:((?![0-9A-HJKMNP-TV-Z]{4}-)[A-Z][A-Z0-9]{1,7})-)?([0-9A-HJKMNP-TV-Z]{4})$" } }
  # `segment` is an allocation instruction, consumed at Gate 1. Once the id
  # carries it, a second copy is free to disagree with the id.
  - if:
      properties: { status: { enum: [active, superseded, retired] } }
    then:
      not: { required: [segment] }
  # Draft status must use draft id.
  - if:
      properties: { status: { const: draft } }
    then:
      properties: { id: { pattern: "^RU-draft-" } }
  # manual conformance requires justification.
  - if:
      properties:
        verification:
          contains:
            required: [conformance]
            properties: { conformance: { const: manual } }
    then:
      properties:
        verification:
          items:
            if:
              required: [conformance]
              properties: { conformance: { const: manual } }
            then: { required: [justification] }
  # scope is required for standard-tier RUs; constitutional RUs may omit it.
  - if:
      properties: { tier: { const: standard } }
      required: [tier]
    then:
      required: [scope]
  - if:
      not: { required: [tier] }      # tier omitted => standard by default
    then:
      required: [scope]
