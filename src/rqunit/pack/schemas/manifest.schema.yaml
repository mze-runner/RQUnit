# Manifest schema (JSON Schema 2020-12 in YAML).
# Normative source: spec v0.13 §5.2, §5.8, §5.9 (v0.13 makes the HTTP surface
# bidirectional: endpoints declare `inbound` and `outbound` field censuses,
# `success_status` retires into `outbound.status`, and wire naming is declared
# in `conventions`). Harmonized from the donor contract-manifest
# schema with these deliberate changes:
#   * story:  → ru:  (traceability link to governing RU/FEAT, §6.6)
#   * rate_limit_keys → generalized `vocabularies` (named controlled sets, C5)
#   * service pattern generalized (no forced "service-" prefix)
#   * inline `# CONFLICT:` comments FORBIDDEN — conflicts are GAP artifacts
#     (unknown keys are already rejected; the ban on conflict comments is a
#     documented convention checked by a grep-class lint on manifest sources)
#   * message/frame `payload` fields remain TYPE NAMES ONLY — the compiler owns
#     those shapes. Endpoints declare censuses directly (§5.9); bringing the
#     async families onto `$defs/field_census` is a later, additive revision.
# Applies to spec/manifests/<service>.manifest.yaml and shared.manifest.yaml
# (shared: interface surfaces FORBIDDEN — values/vocabularies/problem_types only;
#  enforced by the conditional at the bottom).

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "spec/framework/manifest.schema.yaml"
title: ServiceManifest
type: object
additionalProperties: false
required: [service, version]

$defs:
  ru_link:
    type: string
    description: Governing RU or FEAT (bidirectional traceability, §6.6).
    pattern: "^(RU-[0-9]{4}|FEAT-[a-z0-9-]+)$"
  ident:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"

  naming_convention:
    enum: [snake_case, camelCase, kebab-case, PascalCase]

  field_name:
    type: string
    description: >
      A wire-visible field name. Dots denote nesting: `cancellation.at`
      declares a member of the object declared as `cancellation`. The pattern
      admits the union of the naming conventions; which one is legal in a given
      store is `conventions.field_names` (C13) — the grammar permits, the rule
      decides.
    pattern: "^[A-Za-z][A-Za-z0-9_-]*(\\.[A-Za-z][A-Za-z0-9_-]*)*$"

  bound:
    description: >
      A numeric constraint: either a literal, or a `{value:<dotted.key>}` reference
      to a `values` entry. Referencing is preferred — a literal that duplicates a
      registered value is an L24 finding, because a bound restated in two places is
      a bound that can diverge.
    oneOf:
      - type: integer
      - type: string
        pattern: "^\\{value:[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*\\}$"

  field:
    type: object
    additionalProperties: false
    required: [name, presence]
    properties:
      name: { $ref: "#/$defs/field_name" }
      presence:
        enum: [always, never, required, optional, forbidden]
        description: >
          Direction-keyed and NOT interchangeable. Outbound uses always|never,
          where `never` asserts the field MUST NOT LEAK. Inbound uses
          required|optional|forbidden, where `forbidden` asserts the field MUST BE
          REJECTED — the mass-assignment boundary. The schema admits the union;
          C11 rejects a value foreign to the slot's direction, because a leak and
          a validation failure are different bugs with different tests.
      in:
        enum: [path, query, body]
        default: body
        description: >
          Where the client supplies this field. Inbound only (C11). Query and path
          parameters are part of the accepted surface, so `inbound: none` is a
          truthful claim only when the endpoint accepts nothing at all.
      type:
        enum: [string, integer, number, boolean, object, array]
      items:
        enum: [string, integer, number, boolean, object]
        description: >
          Element type; mandatory when `type` is array (C11). Elements that are
          objects declare their members as dotted children of this field.
      nullable:
        type: boolean
        description: >
          Whether the VALUE may be null. Orthogonal to presence, which is about the
          KEY: `presence: always, nullable: false` asserts the key is always there
          and never null — a claim the store cannot otherwise make. Meaningless on
          never/forbidden, where there is no value (C11).
      vocab:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        description: Manifest vocabulary constraining this field's values (C5).
      max_chars: { $ref: "#/$defs/bound" }
      min_chars: { $ref: "#/$defs/bound" }
      min:       { $ref: "#/$defs/bound" }
      max:       { $ref: "#/$defs/bound" }
      min_items: { $ref: "#/$defs/bound" }
      max_items: { $ref: "#/$defs/bound" }
      note:
        type: string
        description: Semantic meaning, for humans and packets.

  field_census:
    description: >
      The declared field set, or the literal `none` asserting this direction
      carries no body. `none` is a POSITIVE claim an extractor can falsify; an
      ABSENT slot is unfinished work, which is why C10 separates the two.
    oneOf:
      - type: array
        minItems: 1
        items: { $ref: "#/$defs/field" }
      - const: none

  inbound:
    description: Everything the endpoint accepts — path, query, and body.
    oneOf:
      - type: object
        additionalProperties: false
        required: [fields]
        properties:
          unknown_fields:
            enum: [reject, ignore]
            description: >
              Overrides `defaults.unknown_fields` for this surface. A policy must
              resolve here or from the service default (C11) — no implicit value,
              on the precedent of `undeclared_event_policy` on models.
          fields: { $ref: "#/$defs/field_census" }
      - const: none

  outbound:
    type: object
    additionalProperties: false
    required: [status, fields]
    description: >
      The success response. Problem responses are not declared here: they are
      owned by `emits` → `problem_types`, and C13 forbids `status` colliding with
      an emitted problem type's status.
    properties:
      status:
        type: integer
        minimum: 200
        maximum: 399
        description: >
          The success code, declared once and beside the body it describes (this
          is where `success_status` went). One status per endpoint: the known
          multi-status cases return the SAME body under a different code, and are
          served additively by a future `alternate_statuses` rather than by
          duplicating the census.
      fields: { $ref: "#/$defs/field_census" }

properties:

  service:
    type: string
    description: Service slug; "shared" reserved for the shared manifest.
    pattern: "^[a-z][a-z0-9-]*$"

  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+$"

  defaults:
    type: object
    additionalProperties: false
    description: Service-wide defaults, each overridable at the point of use.
    properties:
      unknown_fields:
        enum: [reject, ignore]
        description: >
          What an inbound surface does with a field it does not declare — itself a
          security requirement, and one the store had no way to state before.

  audit_forbidden:
    type: array
    description: >
      Field names that must NEVER appear in any audit record, store-wide. Credential
      material in an evidence trail is the audit equivalent of a mass-assignment hole,
      and it is not an event-by-event judgment — declared once in the shared manifest,
      where omitting it is visible rather than a per-event oversight. C6 rejects any
      audit census that declares one of these `always`.
    items: { type: string }
    uniqueItems: true

  conventions:
    type: object
    additionalProperties: false
    description: >
      Store-wide naming standards for WIRE-VISIBLE names, declared once in the
      shared manifest and enforced by C13. Spec identifiers — endpoint, message and
      channel ids, vocabulary names — are NOT governed here: `$defs/ident` fixes
      those, so every id stays addressable by the token grammar. An absent table
      means unenforced; organisations differ, and the manifest is where a house
      standard becomes mechanical rather than remembered.
    properties:
      field_names:   { $ref: "#/$defs/naming_convention" }
      path_segments: { $ref: "#/$defs/naming_convention" }

  problem_types:
    type: object
    description: RFC 7807-style error registry; referenced as {problem:<id>}.
    propertyNames: { pattern: "^[a-z][a-z0-9-]*$" }
    additionalProperties:
      type: object
      additionalProperties: false
      required: [uri, status, title]
      properties:
        uri:    { type: string, pattern: "^urn:problem:[a-z-]+$" }
        status: { type: integer, minimum: 400, maximum: 599 }
        title:  { type: string }

  values:
    type: object
    description: >
      Cross-cutting scalar facts, nested map, referenced as {value:<dotted.key>}.
      Registration rule (§5.4): a value belongs here iff ≥2 RUs reference it —
      that is Gate 1 judgment, not schema. Leaf-scalar constraint (no arrays/
      objects at leaves) is a loader check, not expressible in JSON Schema for
      arbitrary depth.

  audit_events:
    type: array
    description: >
      Referenced as {audit:<code>}. An audit record is EVIDENCE, not telemetry: it is
      an interface surface (§5.4) with a retention window and mandatory absences, and
      something downstream depends on its shape. Common fields are declared once in
      `audit_common`; fields that must never appear, once in `audit_forbidden`.
    items:
      type: object
      additionalProperties: false
      required: [code, fields, ru]
      properties:
        code:   { type: string, pattern: "^[a-z]+(\\.[a-z_]+)+$" }
        fields:
          $ref: "#/$defs/field_census"
          description: >
            The record's own fields, beyond the common envelope — the same census
            grammar every other surface uses, so one field vocabulary covers the store.
            Presence is outbound (`always` | `never`): a record is minted, never accepted.
        retention:
          $ref: "#/$defs/bound"
          description: >
            Days the record must remain retrievable. A compliance fact about the record,
            declared beside it rather than restated in every RU that mentions it.
        ru:     { $ref: "#/$defs/ru_link" }

  audit_common:
    type: array
    description: Fields present on EVERY audit event (declared once — P8).
    items: { type: string }
    uniqueItems: true

  vocabularies:
    type: object
    description: Named controlled value sets, referenced as {vocab:<name>}; membership enforced by C5.
    propertyNames: { pattern: "^[a-z][a-z0-9_]*$" }
    additionalProperties:
      type: array
      minItems: 1
      uniqueItems: true
      items: { type: string }

  endpoints:
    type: array
    description: HTTP surface; authoritative for method+path+access (C4 uniqueness).
    items:
      type: object
      additionalProperties: false
      required: [id, method, path, access, ru]
      properties:
        id:     { $ref: "#/$defs/ident" }
        method: { enum: [GET, POST, PUT, PATCH, DELETE] }
        path:
          type: string
          pattern: "^/"
          description: >
            Route template. Placeholders are `{name}` and MUST be uniquely named
            within one path — C12 binds every placeholder to exactly one `in: path`
            field and back, so the template and the constraints cannot drift.
        inbound:
          $ref: "#/$defs/inbound"
          description: >
            NOT in `required`: completeness is C10's judgment, at error severity,
            so a missing declaration is one attributable violation carrying a
            suggestion rather than a parse failure that says only "invalid".
        outbound: { $ref: "#/$defs/outbound" }
        planned:
          type: boolean
          description: >
            Designed-but-unbuilt (§5.8). Conformance is asymmetric: absence from
            the runtime surface is expected, presence is the "implemented but
            planned — flip at Gate 1" divergence. ru link must be not-done (L22).
        access:
          type: string
          description: >
            Access tier. The tier set is project-defined: it MUST be a
            vocabulary named `access_tiers` in the shared manifest (C5 checks
            membership) — the schema deliberately does not hardcode an enum.
        scope:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: >
            Required credential scope for this endpoint (v0.11): a value from
            the `token_scopes` vocabulary, shared or the owning service's (C5
            checks membership). Meaningful on scoped-credential access tiers;
            the contract bound to the tier (contract.schema access_tier)
            defines the artifact that carries the scope claim.
        ru:     { $ref: "#/$defs/ru_link" }
        emits:
          type: array
          description: >
            problem_type ids this endpoint can return — what a CALLER can be told (C6).
            Audit codes and messages are separate keys: they are different claims with
            different audiences, and one list disambiguated only by which registry a
            string lands in is ambiguous the day the two share a name.
          items: { type: string }
          uniqueItems: true
        audits:
          type: array
          description: audit codes this endpoint records — evidence, invisible to the caller (C6).
          items: { type: string }
          uniqueItems: true
        publishes:
          type: array
          description: >
            message ids this endpoint puts on the bus (C6). Until now the manifest could
            not say that an endpoint publishes a message: both existed, and nothing
            joined them.
          items: { $ref: "#/$defs/ident" }
          uniqueItems: true

  messages:
    type: array
    description: Async surface (subjects/topics); referenced as {message:<id>}.
    items:
      type: object
      additionalProperties: false
      required: [id, subject, direction, payload, ru]
      properties:
        id:        { $ref: "#/$defs/ident" }
        subject:   { type: string, pattern: "^[a-z][a-z0-9_.]*$" }
        direction: { enum: [inbound, outbound] }
        payload:
          type: string
          description: "Wire-contract TYPE NAME only, e.g. wire-contracts::OrderCancelled."
          pattern: "^[A-Za-z0-9_:.-]+$"
        ru:        { $ref: "#/$defs/ru_link" }
        external:
          type: boolean
          description: Producer outside the spec store (§5.8); exempt from C9. Inbound only.
        audits:
          type: array
          description: >
            audit codes recorded while HANDLING this message (C6). Inbound only — on an
            outbound entry you are producing the message, not handling one. This is the
            fix for the largest hole in the old model: an async consumer that mutated
            state had no way to declare what it recorded.
          items: { type: string }
          uniqueItems: true
        planned:
          type: boolean
      allOf:
        - if:
            required: [audits]
          then:
            properties: { direction: { const: inbound } }
        - if:
            required: [external]
            properties: { external: { const: true } }
          then:
            properties: { direction: { const: inbound } }

  channels:
    type: array
    description: WebSocket surface; upgrade_path shares C4 uniqueness with endpoints.
    items:
      type: object
      additionalProperties: false
      required: [id, upgrade_path, access, ru, frames]
      properties:
        id:           { $ref: "#/$defs/ident" }
        upgrade_path: { type: string, pattern: "^/" }
        planned:      { type: boolean }
        access:       { type: string }
        ru:           { $ref: "#/$defs/ru_link" }
        connection_close_codes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, reason]
            properties:
              code:   { type: integer, minimum: 1000, maximum: 4999 }
              reason: { type: string }
        frames:
          type: array
          minItems: 1
          description: Referenced as {frame:<channel_id>.<frame_id>}.
          items:
            type: object
            additionalProperties: false
            required: [id, direction, payload]
            properties:
              id:        { $ref: "#/$defs/ident" }
              direction: { enum: [inbound, outbound] }
              payload:   { type: string, pattern: "^[A-Za-z0-9_:.-]+$" }

allOf:
  # Shared manifest: facts only, no interface surfaces (§5.5). `defaults` is a
  # surface-shaping fact and belongs with the surfaces it shapes.
  - if:
      properties: { service: { const: shared } }
    then:
      properties:
        endpoints: false
        messages:  false
        channels:  false
        defaults:  false
  # `conventions` is store-wide by definition: per-service tables would let the
  # house standard diverge service by service, which is the thing it exists to
  # prevent. Declared once, in the shared manifest, or not at all.
  - if:
      not:
        properties: { service: { const: shared } }
    then:
      properties:
        conventions: false
        audit_forbidden: false
  # Non-shared boundary manifests: at least one surface. Pure-internal
  # services with no surface set service kind via absence — the anyOf below
  # is enforced only when any surface key is expected; operator may relax by
  # removing this block for library-only "services".
  - if:
      not:
        properties: { service: { const: shared } }
    then:
      anyOf:
        - required: [endpoints]
        - required: [messages]
        - required: [channels]
