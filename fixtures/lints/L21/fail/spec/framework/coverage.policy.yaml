# Verification-depth policy (spec §6.7, L21). First matching rule wins;
# `default` closes the set. Policy is DATA — extending it is a PR to this
# file (Gate-1-governed), never a lint code change.
#
# `binds_shape` reads the STATEMENT: since v0.14 an RU proves it is bound to a
# declared shape by addressing a field, not by carrying a contract ref. Without
# it the policy could demand depth but not relevance.
rules:
  - match: { tier: constitutional }
    require: { min_mechanical: 2 }                    # ≥2 of test|model
  - match: { tags_any: [security] }
    require: { types_all: [test], binds_shape: true }
  - match: { tags_any: [audit] }
    require: { binds_shape: true }
default:
  require: { min_verifications: 1 }
