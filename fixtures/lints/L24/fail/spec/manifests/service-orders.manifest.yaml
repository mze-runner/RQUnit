service: service-orders
version: "1.0"
values:
  order: { max_note_chars: 200 }
  paging: { max_limit: 100 }
  # A second fact that happens to equal 200. Unrelated to a note's length, and
  # exactly the shape that made the old suggestion instruct a binding to the
  # wrong one: the rule compares numbers, so it must ask rather than choose.
  retry: { backoff_ms: 200 }
defaults: { unknown_fields: reject }
endpoints:
  - id: update_order
    method: PATCH
    path: "/api/v1/orders/{order_id}"
    access: protected
    ru: FEAT-order-cancellation
    inbound:
      fields:
        - { name: order_id, in: path, presence: required, type: string }
        # both restate a registered value: the copy is what a gated change misses
        - { name: note, presence: optional, type: string, max_chars: 200 }
    outbound:
      status: 200
      fields:
        - { name: page_size, presence: always, type: integer, max: 100 }
