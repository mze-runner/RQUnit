service: service-orders
version: "1.0"
problem_types:
  conflict: { uri: "urn:problem:conflict", status: 409, title: "Conflict" }
values:
  retention: { decision_log_days: 90 }
audit_events:
  - { code: orders.cancelled, fields: [{ name: order_id, presence: always }], ru: RU-0999 }
endpoints:
  - { id: cancel_order, method: DELETE, path: "/api/v1/orders/{id}", access: protected, ru: FEAT-ghost }
messages:
  - { id: order_cancelled, subject: orders.cancelled, direction: outbound, payload: "wire::OrderCancelled", ru: FEAT-order-cancellation }
