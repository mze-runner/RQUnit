service: service-orders
version: "1.0"
problem_types:
  conflict: { uri: "urn:problem:conflict", status: 409, title: "Conflict" }
values:
  retention: { decision_log_days: 90 }
audit_events:
  - { code: orders.cancelled, fields: [order_id, reason], ru: FEAT-order-cancellation }
endpoints:
  - id: cancel_order
    method: DELETE
    path: "/api/v1/orders/{id}"
    access: protected
    ru: FEAT-order-cancellation
    emits: [conflict, orders.cancelled]
    inbound:
      unknown_fields: reject
      fields:
        - { name: id,     in: path,  presence: required, type: string }
        - { name: reason, in: query, presence: optional, type: string, max_chars: 200 }
    outbound: { status: 204, fields: none }

messages:
  - { id: order_cancelled, subject: orders.cancelled, direction: outbound,
      payload: "wire::OrderCancelled", ru: FEAT-order-cancellation }
channels:
  - id: tracking
    upgrade_path: /ws
    access: protected
    ru: FEAT-order-cancellation
    frames:
      - { id: pong, direction: outbound, payload: "ws::Pong" }
