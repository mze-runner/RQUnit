# TASK-010 fixture table — the tokenizer contract. Each case lists the exact
# tokens (kind/qualifier/key) and error reasons expected, in text order.
cases:
  # ---- every kind, unqualified
  - text: "retrievable for {value:retention.decision_log_days} days"
    tokens: [{kind: value, key: retention.decision_log_days}]
  - text: "When a user calls {endpoint:cancel_order}, halt fulfilment"
    tokens: [{kind: endpoint, key: cancel_order}]
  - text: "responds with {problem:conflict}"
    tokens: [{kind: problem, key: conflict}]
  - text: "recorded as {audit:orders.screening.decided}"
    tokens: [{kind: audit, key: orders.screening.decided}]
  - text: "publishes {message:order_cancelled}"
    tokens: [{kind: message, key: order_cancelled}]
  - text: "over {channel:lobby}"
    tokens: [{kind: channel, key: lobby}]
  - text: "sends {frame:lobby.forced_logout} before closing"
    tokens: [{kind: frame, key: lobby.forced_logout}]
  - text: "one of {vocab:access_tiers}"
    tokens: [{kind: vocab, key: access_tiers}]
  # ---- qualified forms (v0.10)
  - text: "calls {endpoint:service-auth/token_refresh}"
    tokens: [{kind: endpoint, qualifier: service-auth, key: token_refresh}]
  - text: "rejects with {problem:service-auth/expired_token}"
    tokens: [{kind: problem, qualifier: service-auth, key: expired_token}]
  - text: "emits {audit:service-auth/account.deleted}"
    tokens: [{kind: audit, qualifier: service-auth, key: account.deleted}]
  - text: "consumes {message:service-auth/session_invalidated}"
    tokens: [{kind: message, qualifier: service-auth, key: session_invalidated}]
  - text: "receives {frame:service-core/lobby.forced_logout}"
    tokens: [{kind: frame, qualifier: service-core, key: lobby.forced_logout}]
  # ---- adjacency, multiplicity, position
  - text: "{endpoint:place_order} emits {audit:orders.screening.decided} within {value:screening.window_seconds} seconds"
    tokens:
      - {kind: endpoint, key: place_order}
      - {kind: audit, key: orders.screening.decided}
      - {kind: value, key: screening.window_seconds}
  - text: "{channel:lobby}{frame:lobby.pong}"
    tokens:
      - {kind: channel, key: lobby}
      - {kind: frame, key: lobby.pong}
  - text: "{vocab:access_tiers}"
    tokens: [{kind: vocab, key: access_tiers}]
  # ---- escaped literal braces
  - text: "a JSON body of the form {{\"op\": \"ping\"}} is accepted"
    tokens: []
  - text: "literal {{braces}} then a real {endpoint:healthz} token"
    tokens: [{kind: endpoint, key: healthz}]
  - text: "no tokens at all here"
    tokens: []
  # ---- keys with digits and underscores
  - text: "{value:username.quarantine_days_v2}"
    tokens: [{kind: value, key: username.quarantine_days_v2}]
  # ---- hyphenated keys (v0.10.2 — RFC 7807-style problem codes)
  - text: "responds with {problem:not-found} when the account is deleted"
    tokens: [{kind: problem, key: not-found}]
  - text: "throttled with {problem:too-many-requests} and a retry header"
    tokens: [{kind: problem, key: too-many-requests}]
  - text: "rejects with {problem:service-billing/payment-failed}"
    tokens: [{kind: problem, qualifier: service-billing, key: payment-failed}]
  - text: "{message:notify_send}"
    tokens: [{kind: message, key: notify_send}]
  - text: "{endpoint:get_me}"
    tokens: [{kind: endpoint, key: get_me}]
  # ---- malformed (8 cases; reasons are the L15 "malformed" classes)
  - text: "uses {endpoints:cancel_order} wrongly"
    errors: [{reason: unknown-kind}]
  - text: "empty ref {endpoint:} here"
    errors: [{reason: empty-key}]
  - text: "nested {endpoint:{value:x}} ref"
    errors: [{reason: nesting}]
  - text: "foreign scalar {value:service-orders/retention.decision_log_days}"
    errors: [{reason: qualified-value}]
  - text: "uppercase {endpoint:CancelOrder}"
    errors: [{reason: malformed}]
  - text: "frame without channel {frame:pong}"
    errors: [{reason: malformed}]
  - text: "dotted endpoint {endpoint:orders.cancel}"
    errors: [{reason: malformed}]
  - text: "unterminated {endpoint:cancel_order and onwards"
    errors: [{reason: malformed}]
  # ---- mixed valid + invalid in one statement
  - text: "{endpoint:healthz} plus bad {endpoint:} ref"
    tokens: [{kind: endpoint, key: healthz}]
    errors: [{reason: empty-key}]
