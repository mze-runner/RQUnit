service: service-orders
version: "1.0"
problem_types:
  conflict: { uri: "urn:problem:conflict", status: 409, title: "Conflict" }
audit_events:
  - { code: orders.cancelled, fields: [order_id], ru: FEAT-order-cancellation }
endpoints:
  - { id: cancel_order, method: DELETE, path: "/api/v1/orders/{id}", access: protected,
      ru: FEAT-order-cancellation, emits: [conflict, orders.cancelled] }
messages:
  - { id: order_cancelled, subject: orders.cancelled, direction: outbound,
      payload: "wire::OrderCancelled", ru: FEAT-order-cancellation }
channels:
  - id: lobby
    upgrade_path: /ws
    access: protected
    ru: FEAT-order-cancellation
    frames:
      - { id: pong, direction: outbound, payload: "ws::Pong" }
