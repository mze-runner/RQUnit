# Every tier a surface uses resolves: three bound to a credential, two declared
# credential-free. The whole relation lives in this one file — the tier string is
# the join, and no endpoint restates it with an `artifact:` key.
service: shared
version: "1.0"
vocabularies:
  access_tiers: [public, internal, protected, scoped, refresh]
credential_free_tiers: [public, internal]
artifacts:
  jwt-access-token:
    access_tier: protected
    fields:
      - { name: sub, where: claims, presence: always, type: string }
      - { name: scope, where: claims, presence: never }
  jwt-pending-verification:
    access_tier: scoped
    fields:
      - { name: sub, where: claims, presence: always, type: string }
  refresh-token:
    access_tier: refresh
    # An opaque token has no internals to describe, and `none` is the honest
    # census for that — a positive claim rather than an unfinished one. Naming
    # the credential is the other half of an artifact's job, and it is the half
    # the tier binding needs.
    fields: none
