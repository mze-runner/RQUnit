service: service-orders
version: "1.0"
defaults: { unknown_fields: reject }
endpoints:
  - id: cancel_order
    method: DELETE
    path: "/api/v1/orders/{order_id}"
    access: protected
    ru: FEAT-order-cancellation
    inbound:
      fields:
        - { name: order_id, in: path, presence: required, type: string }
    outbound: { status: 204, fields: none }
  # both directions carry nothing, and both say so
  - id: healthz
    method: GET
    path: /api/v1/healthz
    access: internal
    ru: FEAT-order-cancellation
    inbound: none
    outbound: { status: 200, fields: none }
