service: service-orders
version: "1.0"
problem_types:
  conflict: { uri: "urn:problem:conflict", status: 409, title: "Conflict" }
endpoints:
  - { id: cancel_order, method: DELETE, path: "/api/v1/orders/{id}", access: protected,
      ru: FEAT-x, emits: [ghost-problem, conflict] }
  - { id: place_order, method: POST, path: /api/v1/orders, access: protected,
      ru: FEAT-x, emits: [unknown.audit_code] }
