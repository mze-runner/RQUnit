service: service-orders
version: "1.0"
problem_types:
  conflict: { uri: "urn:problem:conflict", status: 409, title: "Conflict" }
values:
  retention: { decision_log_days: 90 }
audit_events:
  - { code: orders.cancelled, fields: [{ name: order_id, presence: always }, { name: reason, presence: always }], ru: FEAT-order-cancellation }
endpoints:
  - { id: cancel_order, method: DELETE, path: "/api/v1/orders/{id}", access: protected,
      emits: [conflict], audits: [orders.cancelled] }
