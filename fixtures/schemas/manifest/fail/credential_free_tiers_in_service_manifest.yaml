# Red for one reason: `credential_free_tiers` is a statement about the shared
# tier vocabulary, so a per-service copy could contradict the store it is a
# policy for. Same locality rule as `conventions`.
service: service-orders
version: "1.0"
credential_free_tiers: [public]
endpoints:
  - { id: get_order, method: GET, path: "/api/v1/orders/{id}", access: protected,
      ru: FEAT-order-cancellation }
