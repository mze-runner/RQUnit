# Compliance-kit tree for the extractor role: a minimal order-management
# composition exercising every family the extractor covers.
[stacks.rust]
service = "service-orders"

trace_scan = []

[[stacks.rust.routers]]
file = "src/routes.rs"
function = "router"
prefix = "/api/v1/orders"
access = "protected"

[stacks.rust.messages]
subject_sources = ["src/wire.rs"]
publisher_sources = ["src/publisher.rs"]

[stacks.rust.audit]
code_sources = ["src/audit.rs"]
emitter_sources = ["src/service.rs"]
