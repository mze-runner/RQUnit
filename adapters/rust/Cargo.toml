[package]
name = "rqunit-adapter-rust"
version = "0.1.0"
edition = "2021"
description = "RQUnit adapter for Rust: extracts the surface a codebase actually exposes into actual-surface.json, for `rqunit conformance` to reconcile against the manifests"
publish = false

# Extraction parses router and subject sources. The adapter has NO dependency
# on the codebase it inspects and none on rqunit itself: it reads sources and
# writes one JSON artifact against a pinned contract. That is the whole
# interface — an adapter observes, and never judges.
[dependencies]
syn = { version = "2", features = ["full", "visit"] }
# Reads the consumer's rqunit.toml. Justified rather than assumed: the router
# composition and subject sources are facts about ONE repository, so they must
# be configuration — and they previously lived as constants in this crate,
# which put a consumer's file paths and service names inside the product. The
# alternatives were worse: hand-parsing TOML is fragile, and generating a
# side-file for the adapter to read adds a step and a staleness class. `serde`
# is already present in any codebase this adapter inspects, so the marginal
# cost is the parser itself.
toml = { version = "1", default-features = false, features = ["parse", "std", "serde"] }
# The emitter's input (emit-request) and output (emitted-files) are pinned
# JSON contracts; serde_json parses one and renders the other, exactly as
# `toml` exists for rqunit.toml. Default features only — no preserve_order:
# deterministic (sorted) key order is what a byte-compared contract wants.
serde_json = "1"

[lib]
name = "rqunit_adapter_rust"
path = "src/extract.rs"

[[bin]]
name = "extract-surface"
path = "src/bin/extract-surface.rs"

[[bin]]
name = "scan-checks"
path = "src/bin/scan-checks.rs"

[[bin]]
name = "emit-suite"
path = "src/bin/emit-suite.rs"

[[bin]]
name = "strip-annotations"
path = "src/bin/strip-annotations.rs"
