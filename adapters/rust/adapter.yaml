# Adapter self-declaration (contract: rqunit interfaces/adapter-manifest.schema.json).
# Read by core, never by this adapter. Roles grow as they move out of core:
# the emitter is still an in-core transitional builtin.
contract_version: 1
stack: rust
roles: [extractor, scanner]
config_keys:
  # Read by extract.rs.
  - service
  - routers
  - messages
  - audit
  # Read by scan.rs.
  - trace_scan
  # Core-read transitional key: the in-core emitter still consumes this. It
  # moves to this adapter with its role; listing it here keeps a consumer's
  # working config from warning in the meantime.
  - conformance_crate
